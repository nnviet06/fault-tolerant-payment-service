# Every push and PR into main runs unit tests and all 9 torture scenarios on docker-compose.yml.
# REQUIRE_DB=true makes a missing Postgres or Redis fail, so skipped tests cannot pass the build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Start Postgres and Redis (docker-compose.yml)
        run: docker compose up -d postgres redis

      - name: Wait until Postgres and Redis answer
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U user123 -d userdb \
               && docker compose exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres/Redis not ready after 60 s"
          docker compose logs
          exit 1

      - name: Unit tests + torture suite
        env:
          REQUIRE_DB: "true"
        run: mvn -B -ntp -Ptorture verify

      - name: Torture report in the job summary
        if: always()
        run: |
          if [ -f target/torture-report.md ]; then
            cat target/torture-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No torture report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports and service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/torture-report.md
            target/torture-logs/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
